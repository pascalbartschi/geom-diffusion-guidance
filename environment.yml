name: moldiff
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel

  # core scientific stack
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - plotly
  - pyyaml
  - tqdm
  - sqlalchemy

  # chemistry / structural biology
  - rdkit
  - openbabel
  - gemmi
  - fpocket
  - posebusters

  # notebooks / dev
  - jupyterlab
  - ipykernel
  - ipywidgets

  # optimization / analysis
  - optuna
  - statsmodels
  - scikit-posthocs
  - reportlab

